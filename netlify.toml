# Netlify configuration for ExPorta GST (React + Vite SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # The production site talks to the production Supabase project. Local builds
  # leave this unset and run without a database (demo only), see src/lib/supabase.ts.
  VITE_DATA_ENV = "production"
